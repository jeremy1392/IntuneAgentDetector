# detectorAgent - disclaimer branding
#
# This file customizes the window users see when an AI agent is detected:
# company name, logo, texts, AI policy and contact e-mail. It is read at run
# time: no rebuild is needed.
#
# 1. Edit the values below. Leave a value empty ("") to keep the default.
# 2. Put your logo (and, if you want, your AI policy document) in this folder.
# 3. Check the result on your own computer:
#        detectoragent.exe disclaimer --preview --branding .\branding\branding.yaml
#    The command shows the window, or lists every problem in this file.
# 4. Deploy: install.ps1 copies this whole folder next to detectoragent.exe,
#    where only administrators can modify it.
#
# Texts accept two placeholders: {company} and {email}.
# For logo, policy and email, the value none removes the element.

# Increase this number whenever you change the texts. It is recorded in the
# "disclaimer shown" (400) and "disclaimer accepted" (410) events, so you can
# prove which version of the text a user accepted.
version: 1

# Company name, used by the {company} placeholder.
company: ""

# Logo shown at the top of the window: a PNG (transparency supported) or a
# JPEG, in this folder or given as a full path. It is scaled down to fit
# 540 x 80 pixels and never enlarged. A wide logo of about 540 x 80 pixels
# gives the best result. Leave empty for no logo.
logo: ""

# Window title bar.
title: "AI agent usage: mandatory notice"

# Large blue sentence under the logo.
heading: "An AI agent was detected on your computer."

# Main text, shown after the list of detected tools. Keep the "|" and indent
# every line by two spaces. Empty lines are kept.
text: |
  An AI agent can read your files, run commands, and send data to external services. Its use is governed by the AI policy of {company}:
  • Only use approved tools.
  • Never share confidential, personal, or customer data with a tool that is not approved.
  • You remain responsible for any action an agent takes on your computer.

  This detection and your acceptance are logged by IT Security.

# Checkbox the user must tick before the button is enabled.
checkbox: "I have read and understood the AI acceptable use policy."

# The only button of the window.
button: "I accept"

# The AI policy, opened when the user clicks the link: either a web address
# (https://...) or a document in this folder (PDF, DOCX, HTML, TXT...).
policy: ""
policy_label: "Read the AI policy"

# Contact e-mail, shown as a clickable link that opens the mail client.
email: ""
email_subject: "Question about the AI policy"
# Sentence holding the e-mail link; must contain {email}.
contact_text: "Questions? Contact {email}."
