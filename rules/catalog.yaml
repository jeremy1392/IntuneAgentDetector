# detectorAgent detection catalog.
#
# This file is embedded in the binary. Pass `--rules <file>` to test a modified
# copy without rebuilding. Entries marked "unverified" still need to be
# confirmed against a real installation or vendor documentation.
#
# Path patterns accept these placeholders, expanded per user profile:
#   %USERPROFILE% %APPDATA% %LOCALAPPDATA%
# and these machine-wide ones:
#   %PROGRAMFILES% %PROGRAMFILES(X86)% %PROGRAMDATA% %SYSTEMROOT%
# Glob wildcards (* ? [..]) are allowed in path patterns.

# Endpoints and identifiers were checked against vendor documentation and DNS
# on 2026-11-08; the Anthropic address range and the Trae and Augment data
# folders are still marked unverified.
version: "2026.11.08"

# The disclaimer is shown at every scan for as long as an agent matching the
# trigger rules is detected; accepting it never silences the next scan.
#
# These are the default texts. Customize them, the company name, the logo, the
# AI policy and the contact e-mail in branding\branding.yaml instead: that file
# is read at run time, without rebuilding the executable.
disclaimer:
  version: 1
  company: ""
  logo: ""
  title: "AI agent usage: mandatory notice"
  heading: "An AI agent was detected on your computer."
  text: |
    An AI agent can read your files, run commands, and send data to external services. Its use is governed by the AI policy of {company}:
    • Only use approved tools.
    • Never share confidential, personal, or customer data with a tool that is not approved.
    • You remain responsible for any action an agent takes on your computer.

    This detection and your acceptance are logged by IT Security.
  checkbox: "I have read and understood the AI acceptable use policy."
  button: "I accept"
  policy: "https://intranet.example.com/ai-policy"
  policy_label: "Read the AI policy"
  email: "security@example.com"
  email_subject: "Question about the AI policy"
  contact_text: "Questions? Contact {email}."
  trigger_levels: [active, recent, installed]
  min_confidence: medium

# Tool ids, endpoint hosts or endpoint suffixes approved by the AI policy.
# Examples: github-copilot, corp-xyz.openai.azure.com, .business.githubcopilot.com
sanctioned: []

generic:
  # Children of an LLM-connected process that indicate an agent running tools.
  shells: [cmd.exe, powershell.exe, pwsh.exe, bash.exe, sh.exe, wsl.exe, git.exe, python.exe, python3.exe, node.exe]
  # Processes whose loaded modules and environment are inspected.
  interpreters: [python.exe, python3.exe, pythonw.exe, py.exe, node.exe, bun.exe, deno.exe, pwsh.exe, powershell.exe, java.exe]
  browsers: [chrome.exe, msedge.exe, brave.exe, firefox.exe, chromium.exe, chrome-headless-shell.exe, opera.exe, vivaldi.exe]
  # Plain substrings, matched case-insensitively in browser command lines.
  browser_automation_flags: ["--remote-debugging-port", "--remote-debugging-pipe", "--enable-automation", "--headless", "ms-playwright", "puppeteer", "-juggler"]
  mcp_cmdline:
    - '(?i)@modelcontextprotocol[\\/]'
    - '(?i)\bmcp-server-[a-z0-9-]+'
    - '(?i)\bmcp-remote\b'
    - '(?i)@playwright[\\/]mcp'
    - '(?i)chrome-devtools-mcp'
    - '(?i)\buvx(\.exe)?"?\s+mcp-[a-z0-9-]+'
  inference_modules:
    - '(?i)^ggml[a-z0-9_-]*\.dll$'
    - '(?i)^llama[a-z0-9_-]*\.dll$'
    - '(?i)^onnxruntime-genai\.dll$'
    - '(?i)^mlc_llm[a-z0-9_-]*\.dll$'
  tokenizer_modules:
    - '(?i)^_tiktoken[^\\]*\.pyd$'
    - '(?i)^tokenizers[^\\]*\.pyd$'
  base_url_vars:
    - '(?i)^(OPENAI|ANTHROPIC|AZURE_OPENAI|GEMINI|GOOGLE_GEMINI|GOOGLE_GENAI|MISTRAL|GROQ|OPENROUTER|DEEPSEEK|XAI|TOGETHER|FIREWORKS|COHERE|PERPLEXITY|LITELLM|LLM|HF|HUGGINGFACE|AI_GATEWAY|CLAUDE|CODEX)_[A-Z0-9_]*(BASE_URL|API_BASE|API_URL|ENDPOINT)$'
  api_key_vars:
    - '(?i)^(OPENAI|ANTHROPIC|AZURE_OPENAI|GEMINI|GOOGLE_GENAI|GOOGLE_AI|MISTRAL|GROQ|OPENROUTER|DEEPSEEK|XAI|TOGETHER|FIREWORKS|COHERE|PERPLEXITY|HUGGINGFACE|HF|REPLICATE|CEREBRAS|POE|REQUESTY|PORTKEY|HELICONE|VOYAGE|AI_GATEWAY|MOONSHOT|DASHSCOPE|ZHIPU|SILICONFLOW)_(API_)?(KEY|TOKEN)$'
    - '(?i)^CLAUDE_CODE_OAUTH_TOKEN$'
  vscode_extension_dirs:
    - '%USERPROFILE%\.vscode\extensions'
    - '%USERPROFILE%\.vscode-insiders\extensions'
    - '%USERPROFILE%\.vscode-oss\extensions'
    - '%USERPROFILE%\.cursor\extensions'
    - '%USERPROFILE%\.windsurf\extensions'
    - '%USERPROFILE%\.kiro\extensions'
    - '%USERPROFILE%\.trae\extensions'
  jetbrains_plugin_dirs:
    - '%APPDATA%\JetBrains\*\plugins'
  browser_profile_dirs:
    - '%LOCALAPPDATA%\Google\Chrome\User Data'
    - '%LOCALAPPDATA%\Microsoft\Edge\User Data'
    - '%LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data'
    - '%LOCALAPPDATA%\Chromium\User Data'
  npm_global_dirs:
    - '%APPDATA%\npm\node_modules'
    - '%PROGRAMFILES%\nodejs\node_modules'
    - '%USERPROFILE%\.bun\install\global\node_modules'
    - '%LOCALAPPDATA%\pnpm\global\*\node_modules'
  pip_site_dirs:
    - '%LOCALAPPDATA%\Programs\Python\Python*\Lib\site-packages'
    - '%APPDATA%\Python\Python*\site-packages'
    - '%PROGRAMFILES%\Python*\Lib\site-packages'
    - '%LOCALAPPDATA%\Packages\PythonSoftwareFoundation.Python.*\LocalCache\local-packages\Python*\site-packages'
    - '%USERPROFILE%\anaconda3\Lib\site-packages'
    - '%USERPROFILE%\miniconda3\Lib\site-packages'
  # Directories whose sub-directory names are tool or package names (pipx, uv tool).
  pip_tool_dirs:
    - '%USERPROFILE%\pipx\venvs'
    - '%LOCALAPPDATA%\pipx\pipx\venvs'
    - '%APPDATA%\uv\tools'

tools:
  # ---------------------------------------------------------------- CLI agents
  - id: claude-code
    name: Claude Code
    vendor: Anthropic
    category: cli-agent
    process:
      images: [claude.exe]
      products: [Claude Code]
      signers: [Anthropic]
      paths:
        - '(?i)\\anthropic\.claude-code-[^\\]+\\resources\\native-binary\\claude\.exe$'
        - '(?i)\\\.local\\bin\\claude\.exe$'
        - '(?i)\\@anthropic-ai\\claude-code\\'
      cmdline:
        - '(?i)[\\/]@anthropic-ai[\\/]claude-code[\\/]'
    vscode_extensions: [anthropic.claude-code]
    npm: ['@anthropic-ai/claude-code']
    installed:
      - '%USERPROFILE%\.local\bin\claude.exe'
      - '%APPDATA%\npm\claude.cmd'
    residue:
      - '%USERPROFILE%\.claude'
      - '%USERPROFILE%\.claude.json'
      - '%LOCALAPPDATA%\claude-cli-nodejs'
    history:
      - '%USERPROFILE%\.claude\history.jsonl'
      - '%USERPROFILE%\.claude\projects'
    mcp_configs:
      - '%USERPROFILE%\.claude.json'
    env: [CLAUDE_CONFIG_DIR, CLAUDE_CODE_USE_BEDROCK, CLAUDE_CODE_USE_VERTEX]

  - id: openai-codex
    name: OpenAI Codex / ChatGPT app
    vendor: OpenAI
    category: cli-agent
    process:
      images: [codex.exe, codex-computer-use-swift.exe, codex-windows-sandbox-service.exe, codex-command-runner.exe]
      products: [Codex]
      signers: [OpenAI]
      paths:
        - '(?i)\\OpenAI\\Codex\\'
        - '(?i)\\WindowsApps\\OpenAI\.Codex_[^\\]+_2p2nqsd0c76g0\\'
        - '(?i)\\@openai\\codex\\'
      cmdline:
        - '(?i)[\\/]@openai[\\/]codex[\\/]'
    packages:
      - '^OpenAI\.Codex_2p2nqsd0c76g0$'        # the current "ChatGPT" Store app
      - '^OpenAI\.CodexBeta_2p2nqsd0c76g0$'
      - '^OpenAI\.CodexPrimaryRuntime\.[^_]+_3k8sg7r9htsxt$'
    services: ['^CodexSandboxService']
    vscode_extensions: [openai.chatgpt]
    npm: ['@openai/codex']
    installed:
      - '%LOCALAPPDATA%\OpenAI\Codex\bin'
    residue:
      - '%USERPROFILE%\.codex'
      - '%LOCALAPPDATA%\Packages\OpenAI.Codex_2p2nqsd0c76g0'
    history:
      - '%USERPROFILE%\.codex\sessions'
      - '%USERPROFILE%\.codex\archived_sessions'
      - '%USERPROFILE%\.codex\*.sqlite'
    env: [CODEX_HOME]

  - id: gemini-cli
    name: Gemini CLI
    vendor: Google
    category: cli-agent
    process:
      cmdline: ['(?i)[\\/]@google[\\/]gemini-cli[\\/]']
    npm: ['@google/gemini-cli']
    residue: ['%USERPROFILE%\.gemini']
    history: ['%USERPROFILE%\.gemini\tmp']
    mcp_configs: ['%USERPROFILE%\.gemini\settings.json']

  - id: github-copilot-cli
    name: GitHub Copilot CLI
    vendor: GitHub
    category: cli-agent
    process:
      cmdline: ['(?i)[\\/]@github[\\/]copilot[\\/]']
    npm: ['@github/copilot']
    residue: ['%USERPROFILE%\.copilot']

  - id: opencode
    name: OpenCode
    vendor: Anomaly Innovations
    category: cli-agent
    process:
      images: [opencode.exe]
      products: [OpenCode]
      signers: [Anomaly Innovations]
      paths:
        - '(?i)\\@opencode-aidesktop\\'
        - '(?i)\\opencode-ai\\'
      cmdline: ['(?i)[\\/]opencode-ai[\\/]']
    uninstall: ['(?i)^OpenCode\b']
    npm: [opencode-ai]
    installed: ['%LOCALAPPDATA%\Programs\@opencode-aidesktop\OpenCode.exe']
    residue:
      - '%USERPROFILE%\.config\opencode'
      - '%USERPROFILE%\.local\share\opencode'
    history: ['%USERPROFILE%\.local\share\opencode\storage']

  - id: aider
    name: Aider
    vendor: Aider
    category: cli-agent
    process:
      images: [aider.exe]
      cmdline:
        - '(?i)[\\/]Scripts[\\/]aider(\.exe)?\b'
        - '(?i)\s-m\s+aider\b'
    pip: [aider-chat, aider-install]
    residue: ['%USERPROFILE%\.aider', '%USERPROFILE%\.aider.conf.yml']

  - id: goose
    name: Goose
    vendor: Block
    category: cli-agent
    process:
      images: [goose.exe]
    residue: ['%APPDATA%\Block\goose']
    env: [GOOSE_PATH_ROOT]

  - id: open-interpreter
    name: Open Interpreter
    vendor: Open Interpreter
    category: cli-agent
    process:
      cmdline: ['(?i)[\\/]Scripts[\\/]interpreter(\.exe)?\b']
    pip: [open-interpreter]

  # ------------------------------------------------------ desktop agents/apps
  - id: claude-desktop
    name: Claude Desktop (incl. Cowork)
    vendor: Anthropic
    category: desktop-agent
    process:
      paths:
        - '(?i)\\WindowsApps\\Claude_[^\\]+_pzs8sxrjxfjjc\\'
        - '(?i)\\AnthropicClaude\\'
    packages: ['^Claude_pzs8sxrjxfjjc$']
    services: ['^CoworkVMService$']
    installed: ['%LOCALAPPDATA%\AnthropicClaude\claude.exe']
    residue:
      - '%APPDATA%\Claude'
      - '%LOCALAPPDATA%\Claude-Data'
      - '%LOCALAPPDATA%\Packages\Claude_pzs8sxrjxfjjc'
    history:
      - '%LOCALAPPDATA%\Claude\logs'
      - '%LOCALAPPDATA%\Packages\Claude_pzs8sxrjxfjjc\LocalCache\Local\Claude'
    mcp_configs:
      - '%APPDATA%\Claude\claude_desktop_config.json'
      - '%LOCALAPPDATA%\Packages\Claude_pzs8sxrjxfjjc\LocalCache\Roaming\Claude\claude_desktop_config.json'

  - id: chatgpt-desktop
    name: ChatGPT Classic desktop
    vendor: OpenAI
    category: desktop-assistant
    process:
      products: [ChatGPT]
      signers: [OpenAI]
      paths: ['(?i)\\WindowsApps\\OpenAI\.ChatGPT-Desktop_']
    packages: ['^OpenAI\.ChatGPT-Desktop_2p2nqsd0c76g0$']

  # The consumer Microsoft Copilot app ships with Windows 11. Uncomment it only
  # if the AI policy forbids it, otherwise every user would see the disclaimer.
  # - id: microsoft-copilot-app
  #   name: Microsoft Copilot app
  #   vendor: Microsoft
  #   category: desktop-assistant
  #   packages: ['^Microsoft\.Copilot_8wekyb3d8bbwe$']

  # ------------------------------------------------------------------- AI IDEs
  - id: cursor
    name: Cursor
    vendor: Anysphere
    category: ai-ide
    process:
      images: [cursor.exe, cursor-agent.exe]
      products: [Cursor]
      signers: [Anysphere]
      paths:
        - '(?i)\\Programs\\cursor\\Cursor\.exe$'
        - '(?i)\\cursor-agent\\'                  # Cursor CLI (cursor-agent.* and agent.*)
      cmdline: ['(?i)[\\/]cursor-agent[\\/]']
    uninstall: ['(?i)^Cursor\b']
    installed: ['%LOCALAPPDATA%\Programs\cursor\Cursor.exe', '%LOCALAPPDATA%\cursor-agent']
    residue: ['%APPDATA%\Cursor', '%USERPROFILE%\.cursor']
    history: ['%APPDATA%\Cursor\User\globalStorage\state.vscdb']
    mcp_configs: ['%USERPROFILE%\.cursor\mcp.json']

  - id: windsurf
    name: Windsurf
    vendor: Cognition
    category: ai-ide
    process:
      images: [windsurf.exe]
      products: [Windsurf, Devin Desktop]
      paths: ['(?i)\\Programs\\Windsurf\\Windsurf\.exe$']
    uninstall: ['(?i)^Windsurf\b', '(?i)^Devin Desktop\b']
    vscode_extensions: [codeium.codeium, codeium.windsurf]
    jetbrains_plugins: ['(?i)codeium']
    installed: ['%LOCALAPPDATA%\Programs\Windsurf\Windsurf.exe']
    residue: ['%APPDATA%\Windsurf', '%USERPROFILE%\.windsurf', '%USERPROFILE%\.codeium']
    history: ['%APPDATA%\Windsurf\User\globalStorage\state.vscdb']
    mcp_configs: ['%USERPROFILE%\.codeium\windsurf\mcp_config.json']

  - id: kiro
    name: Kiro
    vendor: Amazon Web Services
    category: ai-ide
    process:
      images: [kiro.exe]
      products: [Kiro]
      paths: ['(?i)\\Programs\\Kiro\\Kiro\.exe$']
    uninstall: ['(?i)^Kiro\b']
    installed: ['%LOCALAPPDATA%\Programs\Kiro\Kiro.exe']
    residue: ['%APPDATA%\Kiro', '%USERPROFILE%\.kiro']
    mcp_configs: ['%USERPROFILE%\.kiro\settings\mcp.json']

  - id: trae
    name: Trae
    vendor: ByteDance
    category: ai-ide
    process:
      images: [trae.exe, 'trae cn.exe']
      products: [Trae, Trae CN]
    uninstall: ['(?i)^Trae\b']
    residue: ['%APPDATA%\Trae', '%APPDATA%\Trae CN', '%USERPROFILE%\.trae', '%USERPROFILE%\.trae-cn']   # unverified

  # ------------------------------------------------------ IDE agents/assistants
  - id: github-copilot
    name: GitHub Copilot (IDE)
    vendor: GitHub
    category: ide-assistant
    process:
      images: [copilot-runtime.exe]
      products: [GitHub Copilot]
      signers: [GitHub]
    vscode_extensions: [github.copilot, github.copilot-chat]
    jetbrains_plugins: ['(?i)^github-copilot-intellij$']

  - id: vscode-agent-mcp
    name: VS Code agent mode (MCP servers configured)
    vendor: Microsoft
    category: ide-agent
    mcp_configs:
      - '%APPDATA%\Code\User\mcp.json'
      - '%APPDATA%\Code - Insiders\User\mcp.json'

  - id: cline
    name: Cline
    vendor: Cline
    category: ide-agent
    vscode_extensions: [saoudrizwan.claude-dev]

  - id: roo-code
    name: Roo Code
    vendor: Roo Code
    category: ide-agent
    vscode_extensions: [rooveterinaryinc.roo-cline]

  - id: kilo-code
    name: Kilo Code
    vendor: Kilo Code
    category: ide-agent
    vscode_extensions: [kilocode.kilo-code]

  - id: continue
    name: Continue
    vendor: Continue
    category: ide-agent
    vscode_extensions: [continue.continue]
    jetbrains_plugins: ['(?i)^continue']
    residue: ['%USERPROFILE%\.continue']

  - id: gemini-code-assist
    name: Gemini Code Assist
    vendor: Google
    category: ide-assistant
    vscode_extensions: [google.geminicodeassist]

  - id: amazon-q
    name: Amazon Q Developer
    vendor: Amazon Web Services
    category: ide-assistant
    vscode_extensions: [amazonwebservices.amazon-q-vscode]
    jetbrains_plugins: ['(?i)^plugin-amazonq$']

  - id: augment
    name: Augment Code
    vendor: Augment
    category: ide-agent
    vscode_extensions: [augment.vscode-augment]
    residue: ['%USERPROFILE%\.augment']   # unverified

  - id: tabnine
    name: Tabnine
    vendor: Tabnine
    category: ide-assistant
    vscode_extensions: [tabnine.tabnine-vscode]
    jetbrains_plugins: ['(?i)^tabnine']

  - id: qodo
    name: Qodo Gen
    vendor: Qodo
    category: ide-agent
    vscode_extensions: [codium.codium]

  - id: jetbrains-ai
    name: JetBrains AI Assistant / Junie
    vendor: JetBrains
    category: ide-agent
    jetbrains_plugins: ['(?i)^ml-llm$', '(?i)^ej$']   # AI Assistant, Junie

  # -------------------------------------------------------- agentic browsers
  - id: perplexity-comet
    name: Perplexity Comet (agentic browser)
    vendor: Perplexity
    category: agentic-browser
    process:
      images: [comet.exe]
      products: [Comet]
      signers: [Perplexity]
      paths: ['(?i)\\Perplexity\\Comet\\Application\\comet\.exe$']
    uninstall: ['(?i)^Comet\b', '(?i)^Perplexity\b']
    residue: ['%LOCALAPPDATA%\Perplexity']

  - id: browser-ai-extension
    name: AI browser extension
    vendor: various
    category: browser-extension
    browser_extensions:
      - '(?i)^claude\b'
      - '(?i)\bchatgpt\b'
      - '(?i)\bperplexity\b'
      - '(?i)\bmonica\b'
      - '(?i)\bsider\b'
      - '(?i)\bharpa\b'
      - '(?i)\bmaxai\b'
      - '(?i)\bmerlin\b'
      - '(?i)\bcopilot\b'
      - '(?i)\bgemini\b'
      - '(?i)\bbrowser[ -]?use\b'
      - '(?i)\bai agent\b'

  # --------------------------------------------------------- local LLM runtimes
  - id: ollama
    name: Ollama
    vendor: Ollama
    category: local-llm
    process:
      images: [ollama.exe, 'ollama app.exe']
      paths: ['(?i)\\Programs\\Ollama\\']
    uninstall: ['(?i)^Ollama\b']
    installed: ['%LOCALAPPDATA%\Programs\Ollama\ollama.exe']
    residue: ['%USERPROFILE%\.ollama', '%APPDATA%\ollama app.exe', '%LOCALAPPDATA%\Ollama']
    models: ['%USERPROFILE%\.ollama\models\manifests\registry.ollama.ai\library\*']
    ports: [11434]
    env: [OLLAMA_HOST, OLLAMA_MODELS]

  - id: lm-studio
    name: LM Studio
    vendor: Element Labs
    category: local-llm
    process:
      images: ['lm studio.exe', lms.exe]
      products: [LM Studio]
      paths: ['(?i)\\Programs\\LM Studio\\']
    uninstall: ['(?i)^LM Studio\b']
    residue: ['%USERPROFILE%\.lmstudio', '%USERPROFILE%\.cache\lm-studio', '%APPDATA%\LM Studio']
    models: ['%USERPROFILE%\.lmstudio\models\*\*', '%USERPROFILE%\.cache\lm-studio\models\*\*']
    ports: [1234]

  - id: jan
    name: Jan
    vendor: Menlo Research
    category: local-llm
    process:
      images: [jan.exe]
      products: [Jan]
      paths: ['(?i)\\Programs\\jan\\']
    uninstall: ['(?i)^Jan\b']
    residue: ['%APPDATA%\Jan', '%USERPROFILE%\jan']
    ports: [1337]

  - id: gpt4all
    name: GPT4All
    vendor: Nomic AI
    category: local-llm
    process:
      paths: ['(?i)\\gpt4all\\bin\\chat\.exe$']
    uninstall: ['(?i)^GPT4All\b']
    residue: ['%LOCALAPPDATA%\nomic.ai', '%APPDATA%\nomic.ai']
    ports: [4891]

  - id: anythingllm
    name: AnythingLLM
    vendor: Mintplex Labs
    category: local-llm
    process:
      images: [anythingllm.exe]
      products: [AnythingLLM]
    uninstall: ['(?i)^AnythingLLM\b']
    residue: ['%APPDATA%\anythingllm-desktop']
    ports: [3001]

  - id: llama-cpp
    name: llama.cpp / llamafile
    vendor: open source
    category: local-llm
    process:
      images: [llama-server.exe, llama-cli.exe, llama-run.exe, llamafile.exe, koboldcpp.exe]
    ports: [5001]

  - id: huggingface-models
    name: Hugging Face local models
    vendor: Hugging Face
    category: local-llm
    confidence: low
    models: ['%USERPROFILE%\.cache\huggingface\hub\models--*']

  # ------------------------------------------------- gateways and frameworks
  - id: litellm
    name: LiteLLM proxy
    vendor: BerriAI
    category: gateway
    process:
      cmdline: ['(?i)[\\/]Scripts[\\/]litellm(\.exe)?\b', '(?i)\s-m\s+litellm\b']
    pip: [litellm]
    ports: [4000]

  - id: browser-use
    name: Browser Use
    vendor: Browser Use
    category: agent-framework
    confidence: low
    pip: [browser-use]

  - id: agent-frameworks
    name: AI agent framework (Python)
    vendor: various
    category: agent-framework
    confidence: low
    pip: [crewai, autogen-agentchat, pyautogen, openai-agents, claude-agent-sdk, smolagents, langgraph, pydantic-ai, agno]

  - id: agent-sdks-node
    name: AI agent SDK (Node.js, global)
    vendor: various
    category: agent-framework
    confidence: low
    npm: ['@anthropic-ai/claude-agent-sdk', '@openai/agents']

# ------------------------------------------------------------------ endpoints
# category: model-provider | aggregator | inference-platform | gateway |
#           dev-tool | web-assistant | agent-infra | model-download | relay
# shared: the domain also serves non-AI traffic; evidence stays low confidence.
endpoints:
  # A. Model providers
  - { host: api.openai.com, provider: OpenAI API, category: model-provider }
  - { host: auth.openai.com, provider: OpenAI sign-in, category: model-provider }
  - { host: chatgpt.com, provider: OpenAI ChatGPT / Codex backend, category: model-provider }
  - { host: chat.openai.com, provider: OpenAI ChatGPT, category: web-assistant }
  - { host: api.anthropic.com, provider: Anthropic API, category: model-provider }
  - { host: console.anthropic.com, provider: Anthropic Console, category: model-provider }
  - { host: platform.claude.com, provider: Anthropic Console, category: model-provider }
  - { host: statsig.anthropic.com, provider: Anthropic telemetry, category: model-provider }
  - { host: claude.ai, provider: Claude.ai, category: web-assistant }
  - { cidr: 160.79.104.0/23, provider: Anthropic API (dedicated range), category: model-provider, unverified: true }
  - { host: generativelanguage.googleapis.com, provider: Google Gemini API, category: model-provider }
  - { host: cloudcode-pa.googleapis.com, provider: Google Gemini Code Assist API, category: model-provider }
  - { host: aiplatform.googleapis.com, provider: Google Vertex AI, category: model-provider, shared: true }
  - { pattern: '^[a-z0-9-]+-aiplatform\.googleapis\.com$', provider: Google Vertex AI (regional), category: model-provider, shared: true }
